<title>Latein-Arena</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centered column like a Roman wax-tablet; mosaic band under the header; stations as a tile grid. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#e2e7ef; --ink:#1a2132; --muted:#58637a; --line:#cdd4e0;
  --accent:#2446a6; --accent-ink:#ffffff; --accent-soft:#dce4f8;
  --gold:#a86c08; --gold-bright:#d99a1e; --gold-soft:#f6e8c8;
  --ok:#21734a; --ok-soft:#d9f0e2; --bad:#b0352a; --bad-soft:#f8dfda;
  --font-d:'Cinzel', 'Trajan Pro', Georgia, serif;
  --font-b:'Nunito', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131c; --surface:#181e2b; --surface-2:#222a3b; --ink:#e8ecf4; --muted:#9aa5bb; --line:#2f3950;
  --accent:#86a2ff; --accent-ink:#0c1120; --accent-soft:#24325a;
  --gold:#e8b450; --gold-bright:#e8b450; --gold-soft:#3a2f17;
  --ok:#62d093; --ok-soft:#173526; --bad:#ff8c7c; --bad-soft:#3e1f1b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f131c; --surface:#181e2b; --surface-2:#222a3b; --ink:#e8ecf4; --muted:#9aa5bb; --line:#2f3950;
  --accent:#86a2ff; --accent-ink:#0c1120; --accent-soft:#24325a;
  --gold:#e8b450; --gold-bright:#e8b450; --gold-soft:#3a2f17;
  --ok:#62d093; --ok-soft:#173526; --bad:#ff8c7c; --bad-soft:#3e1f1b; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;text-align:left}
.brand b{display:block;font-family:var(--font-d);font-weight:800;font-size:1.55rem;letter-spacing:.08em;color:var(--accent);line-height:1.1}
.brand span{font-size:.82rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.purse{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold-bright),var(--gold));display:grid;place-items:center;font-family:var(--font-d);font-size:.72rem;color:#fff8e6;font-weight:800}
.purse small{font-weight:600;color:var(--muted)}
.mosaic{height:10px;margin:14px 0 22px;border-radius:2px;background:conic-gradient(var(--accent) 0 25%,var(--surface) 0 50%,var(--gold-bright) 0 75%,var(--surface) 0) 0 0/10px 10px;opacity:.85}

h1,h2,h3{text-wrap:balance;margin:0}
.lead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:18px}
.lead h1{font-family:var(--font-d);font-size:1.5rem;font-weight:800}
.count{font-weight:800;color:var(--gold)}
.note{color:var(--muted);font-size:.92rem;max-width:62ch;margin:0}

/* Station grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s}
.st:hover{transform:translateY(-2px);border-color:var(--accent)}
.st .lat{font-family:var(--font-d);font-weight:800;font-size:1.25rem;color:var(--accent);letter-spacing:.04em}
.st .de{font-weight:800;font-size:1.05rem}
.st .sub{color:var(--muted);font-size:.88rem;flex:1}
.st .rec{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted);font-weight:700}
.stars{color:var(--gold-bright);letter-spacing:2px;font-size:1rem}
.stars i{font-style:normal;color:var(--line)}
.st.big{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.big .lat,.st.big .sub,.st.big .rec{color:var(--accent-ink)}
.st.big .sub{opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:800}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted);max-width:66ch}

/* Quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qbar .where{font-family:var(--font-d);font-weight:800;color:var(--accent);font-size:1.1rem;flex:1;min-width:0}
.chip{border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;background:var(--surface-2);font-variant-numeric:tabular-nums}
.chip.hot{background:var(--gold-soft);color:var(--gold)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.cat{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:8px}
.prompt{font-size:1.18rem;font-weight:600;margin-bottom:18px;min-width:0;overflow-wrap:anywhere}
.big{display:block;font-size:2.1rem;font-weight:800;color:var(--accent);margin-top:10px;line-height:1.2}
.hint{display:block;font-size:.92rem;color:var(--muted);font-weight:600;margin-top:4px}
.sent{display:block;font-size:1.45rem;font-weight:700;margin-top:12px;line-height:1.7}
mark{background:var(--gold-soft);color:var(--ink);border-bottom:3px solid var(--gold-bright);padding:1px 6px;border-radius:5px}
.lat-t{font-weight:800}
.opts{display:grid;gap:10px}
@media (min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:13px 14px;font-weight:700;font-size:1.04rem;min-width:0;overflow-wrap:anywhere;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt kbd{flex:none;font-family:var(--font-b);font-size:.78rem;font-weight:800;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.dim{opacity:.5}
.opt.lat{font-size:1.15rem}
.seg{margin-bottom:14px}
.seg h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg h3 b{color:var(--accent)}
.segrow{display:flex;flex-wrap:wrap;gap:8px}
.sb{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:800}
.sb:hover:not(:disabled){border-color:var(--accent)}
.sb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sb:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:16px 18px;animation:pop .25s ease-out}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb h3{font-family:var(--font-d);font-size:1.3rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fb.ok h3{color:var(--ok)}
.fb.no h3{color:var(--bad)}
.fb h3 small{font-family:var(--font-b);font-size:.9rem;font-weight:800;color:var(--gold)}
.fb p{margin:8px 0 0}
.tr{color:var(--muted);font-style:italic}
.next{margin-top:14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.keys{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* Result */
.res{text-align:center;padding:30px 22px}
.res .rank{font-family:var(--font-d);font-weight:800;font-size:2.6rem;color:var(--accent);letter-spacing:.05em}
.res .rde{color:var(--muted);font-weight:700}
.res .stars{font-size:2.4rem;letter-spacing:8px;margin:10px 0}
.nums{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:14px 0 6px}
.nums div{font-weight:700;color:var(--muted);font-size:.85rem}
.nums b{display:block;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
.res .tools{justify-content:center}
.miss{margin-top:22px;display:grid;gap:10px}
.miss h2{font-family:var(--font-d);font-size:1.15rem;margin-top:8px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.mi .big{display:inline;font-size:1.1rem;margin:0 4px}
.mi .hint,.mi .sent{display:inline;font-size:inherit;margin:0 0 0 4px}
.mi .sent{font-size:1rem}
.mi .your{color:var(--bad);font-weight:700}

/* Tafel */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tbox h3{font-family:var(--font-d);font-size:1rem;color:var(--accent);margin-bottom:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
td b{color:var(--accent)}
.sec{margin:26px 0 12px;font-family:var(--font-d);font-size:1.25rem}
.rq{display:grid;gap:8px}
.rq div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rq b{color:var(--accent)}

/* Own vocab */
textarea{width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;font:inherit;font-size:1rem}
label.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:12px}
.ok-msg{color:var(--ok);font-weight:800}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- helpers ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('la6b:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('la6b:'+k,JSON.stringify(v))}catch(e){}}};
function prefer(pool,fn,n=3){return shuffle(pool.filter(fn)).concat(shuffle(pool.filter(x=>!fn(x)))).slice(0,n)}
function mc(cat,key,prompt,correct,wrongs,explain,extra={}){
  const opts=shuffle([correct,...uniq(wrongs).filter(w=>w!==correct).slice(0,3)]);
  return {type:'mc',cat,key,prompt,opts,ans:opts.indexOf(correct),explain,...extra};
}
function weighted(arr){const tot=arr.reduce((s,x)=>s+x[1],0);let r=Math.random()*tot;for(const [f,w] of arr){if((r-=w)<0)return f()}return arr[0][0]()}

/* ---------- Deklinationen ---------- */
const KAS=['Nominativ','Genitiv','Dativ','Akkusativ','Ablativ'];
const KAS_S=['Nom.','Gen.','Dat.','Akk.','Abl.'];
const NUM=['Singular','Plural'], NUM_S=['Sg.','Pl.'];
const GEN_L={m:'Maskulinum',f:'Femininum',n:'Neutrum'};
const TABLES={
  a: {name:'a-Deklination',            ex:'amica',  end:['a','ae','ae','am','a','ae','arum','is','as','is']},
  us:{name:'o-Deklination (auf -us)',  ex:'servus', end:['us','i','o','um','o','i','orum','is','os','is']},
  um:{name:'o-Deklination (Neutrum)',  ex:'donum',  end:['um','i','o','um','o','a','orum','is','a','is']},
  er:{name:'o-Deklination (auf -er)',  ex:'puer',   end:['','i','o','um','o','i','orum','is','os','is']},
  k: {name:'3. Deklination (m/f)',     ex:'senator',end:['','is','i','em','e','es','um','ibus','es','ibus']},
  kn:{name:'3. Deklination (Neutrum)', ex:'corpus', end:['','is','i','','e','a','um','ibus','a','ibus']}
};
const NOUNS=[
  {st:'amic',t:'a',g:'f',de:'Freundin'},{st:'vill',t:'a',g:'f',de:'Landhaus'},{st:'port',t:'a',g:'f',de:'Tor'},
  {st:'turb',t:'a',g:'f',de:'Menschenmenge'},{st:'fabul',t:'a',g:'f',de:'Geschichte'},
  {st:'serv',t:'us',g:'m',de:'Sklave'},{st:'domin',t:'us',g:'m',de:'Herr'},{st:'equ',t:'us',g:'m',de:'Pferd'},{st:'fili',t:'us',g:'m',de:'Sohn'},
  {st:'don',t:'um',g:'n',de:'Geschenk'},{st:'for',t:'um',g:'n',de:'Marktplatz'},{st:'templ',t:'um',g:'n',de:'Tempel'},{st:'pericul',t:'um',g:'n',de:'Gefahr'},
  {nom:'puer',st:'puer',t:'er',g:'m',de:'Junge'},{nom:'ager',st:'agr',t:'er',g:'m',de:'Acker, Feld'},
  {nom:'senator',st:'senator',t:'k',g:'m',de:'Senator'},{nom:'mercator',st:'mercator',t:'k',g:'m',de:'Kaufmann'},
  {nom:'clamor',st:'clamor',t:'k',g:'m',de:'Geschrei'},{nom:'vox',st:'voc',t:'k',g:'f',de:'Stimme'},
  {nom:'homo',st:'homin',t:'k',g:'m',de:'Mensch'},{nom:'pater',st:'patr',t:'k',g:'m',de:'Vater'},{nom:'mater',st:'matr',t:'k',g:'f',de:'Mutter'},
  {nom:'corpus',st:'corpor',t:'kn',g:'n',de:'Körper'},{nom:'nomen',st:'nomin',t:'kn',g:'n',de:'Name'},{nom:'tempus',st:'tempor',t:'kn',g:'n',de:'Zeit'},
  /* aus Lektion 12 und 13 */
  {st:'caus',t:'a',g:'f',de:'Ursache, Sache'},{st:'gladi',t:'us',g:'m',de:'Schwert'},{st:'marit',t:'us',g:'m',de:'Ehemann'},
  {st:'tel',t:'um',g:'n',de:'Waffe, Geschoss'},{nom:'rex',st:'reg',t:'k',g:'m',de:'König'},
  {nom:'munitio',st:'munition',t:'k',g:'f',de:'Bau, Befestigung'},{nom:'scelus',st:'sceler',t:'kn',g:'n',de:'Verbrechen'}
];
const forms=n=>TABLES[n.t].end.map(e=>e===''?n.nom:n.st+e);
const lemma=n=>{const f=forms(n);return `${f[0]}, ${f[1]}`};
const kn=i=>`${KAS[i%5]} ${NUM[i<5?0:1]}`;

/* Adjektive der a- und o-Deklination (Lektion 13, S. 48) */
const ADJ=[{st:'magn',de:'groß'},{st:'bon',de:'gut'},{st:'mal',de:'schlecht'},{st:'superb',de:'stolz, überheblich'},
  {nom:'miser',st:'miser',de:'arm, unglücklich'},{st:'ultim',de:'der letzte'},{st:'Roman',de:'römisch'},{st:'mult',de:'viel'}];
const adjForms=a=>({m:forms(a.nom?{nom:a.nom,st:a.st,t:'er'}:{st:a.st,t:'us'}),f:forms({st:a.st,t:'a'}),n:forms({st:a.st,t:'um'})});
const adjLemma=a=>{const F=adjForms(a);return a.nom?`${F.m[0]}, ${F.f[0]}, ${F.n[0]}`:`${F.m[0]}, -a, -um`};
const kng=v=>`${KAS[v.c]} ${NUM[v.n]} ${GEN_L[v.g]}`;
function qKoenig(){
  let form,valid=[],hint,extra='',key;
  if(Math.random()<.25){
    const a=pick(ADJ),F=adjForms(a),g=pick(['m','f','n']);form=F[g][rnd(10)];
    ['m','f','n'].forEach(gg=>F[gg].forEach((x,j)=>{if(x===form)valid.push({c:j%5,n:j<5?0:1,g:gg})}));
    hint=`Adjektiv von <i>${adjLemma(a)}</i> · ${a.de}`;key='ka:'+form;
    extra=' Bei Adjektiven ergibt sich das Genus aus der Endung.';
  }else{
    const n=pick(NOUNS),f=forms(n);form=f[rnd(10)];
    f.forEach((x,j)=>{if(x===form)valid.push({c:j%5,n:j<5?0:1,g:n.g})});
    hint=`von <i>${lemma(n)}</i> · ${n.de}`;key='k:'+form+n.st;extra=` (${TABLES[n.t].name})`;
  }
  const sol=valid.map(kng).join(' oder ');
  return {type:'koenig',cat:'Formenbestimmung · KöNiG',key,valid,
    prompt:`Bestimme Kasus, Numerus und Genus:<span class="big">${form}</span><span class="hint">${hint}</span>`,
    solution:sol,
    explain:`<b>${form}</b> = ${sol}.${extra}${valid.length>1?' Hier passen mehrere Möglichkeiten – eine davon reicht als Antwort.':''}`};
}
function qKNG(){
  const n=pick(NOUNS),f=forms(n),i=rnd(10),nf=f[i],a=pick(ADJ),F=adjForms(a)[n.g],ok=new Set();
  f.forEach((x,j)=>{if(x===nf)ok.add(F[j])});
  const c=F[i],all=adjForms(a),pool=uniq([...all.m,...all.f,...all.n]).filter(x=>!ok.has(x));
  const diff=!['a','us','um','er'].includes(n.t)||(n.t==='a'&&n.g!=='f');
  return mc('KNG-Kongruenz','kng:'+nf+a.st,`Welche Form von <span class="lat-t">${adjLemma(a)}</span> (${a.de}) passt zu:<span class="big">${nf}</span><span class="hint">von <i>${lemma(n)}</i> · ${n.de}</span>`,
    c,shuffle(pool),`<b>${nf} ${c}</b>: Das Adjektiv richtet sich in Kasus, Numerus und Genus nach dem Nomen (${kn(i)}, ${GEN_L[n.g]}).${diff?' Die Endungen sehen hier verschieden aus, weil Nomen und Adjektiv zu verschiedenen Deklinationen gehören – gleich ist nur KNG!':''}`,{lat:true});
}
function qBilde(){
  const n=pick(NOUNS),f=forms(n),i=rnd(10),t=f[i];
  return mc('Formen bilden','b:'+n.st+i,`Bilde den <b>${kn(i)}</b> von <span class="lat-t">${lemma(n)}</span> (${n.de}).`,
    t,shuffle(uniq(f.filter(x=>x!==t))),`${kn(i)} von ${f[0]}: <b>${t}</b> · ${TABLES[n.t].name}`,{lat:true});
}
function qEndung(){
  const k=pick(['a','us','um','k','kn']),T=TABLES[k];let i;do{i=rnd(10)}while(T.end[i]==='');
  const c='-'+T.end[i];const ex=forms(NOUNS.find(n=>n.t===k))[i];
  return mc('Deklinationenbasilika','e:'+k+i,`Welche Endung hat die <b>${T.name}</b> im <b>${kn(i)}</b>?<span class="hint">Musterwort: ${T.ex}</span>`,
    c,shuffle(uniq(T.end.filter(x=>x!=='').map(x=>'-'+x))),`${T.name}, ${KAS_S[i%5]} ${NUM_S[i<5?0:1]}: <b>${c}</b> – zum Beispiel <i>${ex}</i>.`,{lat:true});
}
function qDekl(){
  const n=pick(NOUNS),f=forms(n);
  const D={a:'a-Deklination',us:'o-Deklination',um:'o-Deklination',er:'o-Deklination',k:'3. Deklination',kn:'3. Deklination'};
  const c=D[n.t];
  return mc('Deklinationenbasilika','d:'+n.st,`Zu welcher Deklination gehört <span class="lat-t">${f[0]}, ${f[1]}</span>?`,
    c,uniq(Object.values(D)),`Am Genitiv Singular erkennst du die Deklination: <i>${f[1]}</i> → <b>${c}</b>.`);
}

/* ---------- Verben ---------- */
const PRON=['ich','du','er/sie/es','wir','ihr','sie'];
const AUX={h:['habe','hast','hat','haben','habt','haben'],s:['bin','bist','ist','sind','seid','sind']};

const parseS=s=>s.split(' ').map(w=>{const [t,r]=w.split('|');return {t:t.replace(/_/g,' '),r}});
function qSatzRole(){
  const s=pick(SENT),parts=parseS(s[0]),i=rnd(parts.length),x=parts[i],c=ROLES[x.r];
  let ex=`Frage: <i>${RQ[x.r]}</i> → <b>${x.t}</b> ist ein ${c}.`;
  if(x.r==='P'&&!parts.some(p=>p.r==='S'))ex+=' Das Subjekt steckt hier in der Personalendung.';
  if(x.r==='T')ex+=' Das Attribut ist kein eigenes Satzglied, sondern gehört zu einem Nomen.';

    prompt:`Welches Satzglied ist markiert?<span class="sent">${parts.map((p,j)=>j===i?`<mark>${p.t}</mark>`:p.t).join(' ')}.</span>`,
    opts:ROLE_OPTS.slice(),ans:ROLE_OPTS.indexOf(c),explain:ex};

function qSatzFind(){

  }

}

  const cat=w[3]?`Vokabeln · Lektion ${w[3]}`:w[2]==='own'?'Vokabeln · eigene':'Vokabeln · Grundwortschatz';
  if(dir===0)return mc(cat,'v:'+w[0],`Was bedeutet:<span class="big">${esc(w[0])}</span>`,esc(w[1]),wr,`<b>${esc(w[0])}</b> = ${esc(w[1])}`);
  return mc(cat,'v:'+w[0],`Wie heißt auf Latein:<span class="big">${esc(w[1])}</span>`,esc(w[0]),wr,`${esc(w[1])} = <b>${esc(w[0])}</b>`,{lat:true});
}

  <label for="owntext" class="cat">Deine Vokabeln</label>
  <textarea id="owntext" placeholder="nuntius, -i m = Bote&#10;timere = fürchten&#10;postea = später">${esc(own.map(x=>x[0]+' = '+x[1]).join('\n'))}</textarea>
  <label class="chk"><input type="checkbox" id="ownonly" ${store.get('ownOnly',false)?'checked':''}> Nur meine eigenen Vokabeln abfragen (ab 4 Wörtern)</label>
  <div class="next"><span id="savemsg" class="ok-msg" aria-live="polite"></span><button class="btn pri" data-act="saveown">Speichern</button></div></section>`;
}
function render(){
  const v={home:homeView,quiz:quizView,result:resultView,tafel:tafelView,own:ownView}[S.view];
  app.innerHTML=header()+v();
  if(S.view==='quiz'&&S.done){const b=document.getElementById('nextbtn');b&&b.focus({preventScroll:true})}
}
function go(view){S={view};render();window.scrollTo(0,0)}
function start(id,qs){const st=STATIONS.find(s=>s.id===id);
  S={view:'quiz',st,qs:qs||buildRound(st),i:0,score:0,streak:0,maxStreak:0,right:0,wrong:[],done:false,sel:{}};render();window.scrollTo(0,0)}
function finish(ok,your,idx){
  const q=S.qs[S.i];S.done=true;let pts=0;
  if(ok){S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);pts=10+Math.min(S.streak-1,5)*2;S.score+=pts;S.right++;store.set('denarii',store.get('denarii',0)+pts)}
  else{S.streak=0;S.wrong.push({q,your})}
  S.last={ok,pts,idx};render();
}
function next(){
  S.i++;S.done=false;S.sel={};
  if(S.i>=S.qs.length){
    const pct=Math.round(S.right/S.qs.length*100),stars=pct>=90?3:pct>=70?2:pct>=50?1:0,best=store.get('best',{});
    if(!S.retry&&(!best[S.st.id]||best[S.st.id].pct<pct)){best[S.st.id]={pct,stars};store.set('best',best)}
    S.view='result';
  }
  render();window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home')go('home');
  else if(a==='tafel')go('tafel');
  else if(a==='own')go('own');
  else if(a==='start')start(b.dataset.id);
  else if(a==='retry'){const st=S.st,qs=shuffle(S.wrong.map(w=>w.q));start(st.id,qs);S.retry=true}
  else if(a==='pick'&&!S.done){const i=+b.dataset.i,q=S.qs[S.i];finish(i===q.ans,q.opts[i],i)}
  else if(a==='sel'&&!S.done){const k=b.dataset.k;S.sel[k]=k==='g'?b.dataset.v:+b.dataset.v;render()}
  else if(a==='check'&&!S.done){const q=S.qs[S.i],s=S.sel;
    const ok=q.valid.some(v=>v.c===s.c&&v.n===s.n&&v.g===s.g);finish(ok,`${KAS[s.c]} ${NUM[s.n]} · ${GEN_L[s.g]}`)}
  else if(a==='next')next();
  else if(a==='saveown'){
    const lines=document.getElementById('owntext').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const list=[];lines.forEach(l=>{const m=l.match(/^(.+?)\s*(?:=|\t|;| - | – )\s*(.+)$/);if(m)list.push([m[1].trim(),m[2].trim(),'own'])});
    store.set('own',list);store.set('ownOnly',document.getElementById('ownonly').checked);
    document.getElementById('savemsg').textContent=`${list.length} Vokabeln gespeichert.`;
  }
});
document.addEventListener('keydown',e=>{
  if(S.view!=='quiz'||/TEXTAREA|INPUT/.test(document.activeElement?.tagName||''))return;
  const q=S.qs[S.i];
  if(!S.done&&q.type==='mc'&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(i<q.opts.length){e.preventDefault();finish(i===q.ans,q.opts[i],i)}}
  else if(S.done&&e.key==='Enter'){e.preventDefault();next()}
});
render();
</script>
