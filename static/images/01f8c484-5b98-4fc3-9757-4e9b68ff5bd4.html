<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latein-Arena</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#8c2f39;--gold:#c99a2e;--ok:#16a34a;--ko:#dc2626;--bd:#e3dcd2;--hl:#fde68a;
--L-S:#2563eb;--L-P:#c026d3;--L-AO:#0d9488;--L-AB:#ea580c;--L-GA:#7c3aed;--L-INF:#a16207;--L-K:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--tx:#f3ece4;--mu:#a89f95;--ac:#e07a85;--gold:#f0c35a;--ok:#4ade80;--ko:#f87171;--bd:#44403c;--hl:#713f12;
--L-S:#60a5fa;--L-P:#e879f9;--L-AO:#2dd4bf;--L-AB:#fb923c;--L-GA:#a78bfa;--L-INF:#facc15;--L-K:#a8a29e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--tx:#f3ece4;--mu:#a89f95;--ac:#e07a85;--gold:#f0c35a;--ok:#4ade80;--ko:#f87171;--bd:#44403c;--hl:#713f12;
--L-S:#60a5fa;--L-P:#e879f9;--L-AO:#2dd4bf;--L-AB:#fb923c;--L-GA:#a78bfa;--L-INF:#facc15;--L-K:#a8a29e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:12px 16px 140px}
h1{margin:4px 0 0;font:700 28px Georgia,serif;color:var(--ac)}
.sub{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.big:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:600}
/* Rang */
.rank{display:flex;align-items:center;gap:12px}
.rank .ico{font-size:38px}
.rank b{font-size:18px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ac));transition:width .5s}
/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;min-height:118px;position:relative;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .e{font-size:30px}.tile b{display:block;margin-top:4px}.tile span{font-size:13px;color:var(--mu)}
.tile.star{grid-column:1/-1;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--ac);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* Spiel-Kopf */
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mu);gap:8px}
.top .home{border:0;background:none;font-size:22px;padding:0 4px}
.streak{font-weight:700;color:var(--gold)}
.cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-top:10px}
.q{font-size:19px;margin:6px 0 10px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:2px solid var(--bd);background:var(--bg)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.ok::after{content:" ✓";color:var(--ok);font-weight:700}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 16%,transparent);text-decoration:line-through}
.opt.ko::after{content:" ✗";color:var(--ko);font-weight:700}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:15px}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,transparent);border-left:4px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--ko) 12%,transparent);border-left:4px solid var(--ko)}
/* Satz */
.sent{font:21px/1 Georgia,"Times New Roman",serif;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 0;margin:14px 0 6px}
.grp{display:inline-flex;flex-wrap:wrap;border-radius:12px}
.showgrp .grp{outline:2px dashed var(--mu);outline-offset:-1px;margin:0 3px}
.wd{display:inline-flex;flex-direction:column;align-items:center;min-width:24px;margin:0 2px}
.wd .tp{font:700 11px system-ui;height:15px;line-height:15px;white-space:nowrap}
.w{border:0;background:none;font:inherit;padding:6px 4px 9px;margin:0;border-radius:8px;color:var(--tx);min-height:44px}
.w.sel{background:color-mix(in srgb,var(--c) 14%,transparent)}
.wd .tg{font:700 11px system-ui;color:var(--c,var(--mu));min-height:15px;white-space:nowrap}
.punct{font:21px Georgia,serif;align-self:flex-start;padding-top:22px;margin-left:-4px}
.wd.ko .w{background:color-mix(in srgb,var(--ko) 16%,transparent);outline:2px solid var(--ko)}
.wd.ok .w{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.wd.ko .tp{color:var(--ko);text-decoration:line-through}
.wd.ok .tp{color:var(--ok)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pp .25s}@keyframes pp{50%{transform:scale(1.15)}}
.blitzword{background:var(--hl);border-radius:6px;padding:1px 3px;font-weight:700}
.plain{font:20px/1.8 Georgia,serif;margin:10px 0}
/* Markierungen (wie im Unterricht) */
.m-S{text-decoration:underline solid var(--c);text-decoration-thickness:3px;text-underline-offset:7px}
.m-P{text-decoration:underline double var(--c);text-decoration-thickness:2px;text-underline-offset:7px}
.m-AO{text-decoration:underline dashed var(--c);text-decoration-thickness:3px;text-underline-offset:7px}
.m-AB{text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:6px}
.m-GA{text-decoration:underline solid var(--c);text-decoration-thickness:2px;text-underline-offset:7px;background-image:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 8px);background-size:100% 9px;background-position:0 calc(100% - 1px);background-repeat:no-repeat}
.m-INF{text-decoration:underline dotted var(--c);text-decoration-thickness:3px;text-underline-offset:7px}
.m-K{outline:2px solid var(--c);border-radius:999px!important}
/* Palette */
.pal{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.pal .in{max-width:680px;margin:0 auto}
.pal .hint{font-size:12px;color:var(--mu);text-align:center;margin-bottom:6px}
.pbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pb{border:2px solid var(--c);background:var(--bg);border-radius:10px;padding:6px 2px;font-size:12px;line-height:1.15;color:var(--tx)}
.pb b{display:block;color:var(--c);font-size:15px}
.pb.on{background:var(--c);color:#fff}.pb.on b{color:#fff}
.pb.era{--c:var(--mu)}
.acts{display:flex;gap:8px}.acts button{flex:1}
.err{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.err:first-child{border-top:0}
.lt{display:inline-block;border-radius:6px;padding:0 6px;color:#fff;font-weight:700;font-size:13px;background:var(--c)}
.lt.x{background:var(--ko);text-decoration:line-through}
.stars{font-size:34px;text-align:center;letter-spacing:6px;margin:6px 0}
.de{font-style:italic;color:var(--mu);margin-top:8px}
/* Spickzettel */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.modal .card{max-width:680px;width:100%;max-height:88vh;overflow:auto;margin:0;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal ol{padding-left:20px;margin:6px 0}.modal li{margin:6px 0}
.legrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.legrow .s{font:18px Georgia,serif;min-width:70px;padding-bottom:6px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:8px 0 2px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;z-index:30;transition:opacity .3s}
</style></head><body>
<canvas id="cf"></canvas>
<main>
<!-- START -->
<section id="home">
  <h1>🏛️ Latein-Arena</h1>
  <div class="sub">Lektion 12 & 13 · 13 T, Z. 1–6 · KA am Mi, 24.11.26</div>
  <div class="card rank"><div class="ico" id="rIco">🪖</div><div style="flex:1"><b id="rName"></b><div class="sub" id="rXp"></div><div class="bar"><i id="rBar"></i></div></div></div>
  <div class="tiles">

    <button class="tile" data-go="new"><div class="e">🗡️</div><b>Satzglied-Jagd: neue Sätze</b><span>6 unbekannte Sätze mit den Vokabeln aus L 12/13</span></button>
    <button class="tile" data-go="blitz"><div class="e">⚡</div><b>Blitz-Bestimmung</b><span>Ein Wort ist markiert – welches Satzglied ist es?</span></button>

    <button class="tile" data-go="miss"><span class="badge hide" id="missN"></span><div class="e">🔁</div><b>Fehler-Kiste</b><span id="missTx">Was du falsch hattest, kommt hier wieder</span></button>
  </div>
  <div class="card hide" id="mixSel"><b>Themen für den Wissens-Mix</b><div class="chips" id="chips"></div><div class="sub" id="cnt"></div><button class="big" id="mixGo">Los geht's!</button></div>
  <button class="big ghost" id="cheatBtn">🧭 Spickzettel: So findest du die Satzglieder</button>
</section>

<!-- SPIEL -->
<section id="play" class="hide">
  <div class="top"><button class="home" id="quit" aria-label="Zum Menü">✕</button><span id="prog"></span><span class="streak" id="streak"></span><span id="xpNow"></span></div>

  <div class="card" id="stage"></div>
</section>

<!-- ENDE -->
<section id="end" class="hide">
  <div class="card" style="text-align:center"><div style="font-size:54px" id="endIco">🏆</div><b style="font-size:22px" id="res"></b><div class="sub" id="resSub"></div></div>
  <div class="card" id="bycat"></div>
  <button class="big" id="again">Nochmal!</button>
  <button class="big ghost" id="toHome">Zum Menü</button>
</section>
</main>

<div class="pal hide" id="pal"><div class="in"><div class="hint" id="palHint"></div><div class="pbtns" id="pbtns"></div></div></div>
<div class="modal hide" id="cheat"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">🧭 Satzglied-Fahrplan</b><button class="chip" id="cheatX">Schließen</button></div><ol id="stratList"></ol><b>Legende (wie im Unterricht markiert)</b><div id="legend"></div></div></div>

dlich vertreibt Brutus die Familie der Tarquinier."}, {"id": "N16", "title": "Satz 16", "parts": [["Romani et Collatinus", "S", "Wer? – die Römer und Collatinus"], ["Tarquinium", "AO", "Wen? – Tarquinius"], ["cum filio", "AB", "Mit wem? – mit seinem Sohn"], ["expellunt", "P", "Was tun sie? – sie vertreiben"]], "de": "Die Römer und Collatinus vertreiben Tarquinius mit seinem Sohn."}];
const STRAT=[["Bindewörter einkreisen", "<b>et, quod, ubi</b> sind <i>keine</i> Satzglieder. Sie trennen den Satz in Teilsätze – jeder Teilsatz hat sein <b>eigenes</b> Prädikat."], ["Prädikat zuerst!", "Suche das Verb mit Personalendung (<b>-t, -nt, -it, -erunt …</b>) und unterstreiche es doppelt. Die Endung verrät die Person: <b>-nt / -erunt</b> → „sie“ (Plural)."], ["Subjekt fragen: Wer oder was?", "Suche einen <b>Nominativ</b>, der zur Endung des Prädikats passt (Plural zu Plural). Findest du keinen, <b>steckt das Subjekt im Prädikat</b> (properaverunt = <i>sie</i> eilten)."], ["Objekt fragen: Wen oder was?", "Akkusativ-Endungen: <b>-am, -um, -em, -as, -os, -es</b>; bei Neutra auch <b>-a</b> (arma) – Achtung: Neutrum Akk. = Nom. (forum, scelus)."], ["Umstände fragen: Wo? Wann? Wie? Womit?", "Präposition + Nomen gehören <b>zusammen</b> (cum multis viris = eine AB). Auch Adverbien (statim, tandem, non iam) und Ablative ohne Präposition (gladiis, magna voce) sind AB."], ["Genitiv anhängen: Wessen?", "Genitive (<b>-ae, -i, -orum, -is</b>) sind <b>kein eigenes Satzglied</b> – sie hängen an einem Nomen (causam <u>clamoris</u>)."], ["Schluss-Check", "Jedes Wort markiert? Adjektiv beim Nomen (KNG)? Jeder Teilsatz hat genau ein Prädikat?"]];
const Q=[["Satzglied-Strategie", "Womit fängst du bei der Satzglied-Bestimmung an (nach dem Einkreisen der Bindewörter)?", ["Mit dem Prädikat", "Mit dem ersten Wort", "Mit dem Subjekt", "Mit dem Genitiv"], "Das Prädikat (Verb mit Personalendung) ist der Kern. Seine Endung verrät dir, ob das Subjekt Singular oder Plural ist."], ["Satzglied-Strategie", "Welche Satzglieder muss jeder (Teil-)Satz unbedingt haben?", ["Prädikat und Subjekt (das Subjekt kann im Prädikat stecken)", "Subjekt und Akkusativ-Objekt", "Prädikat und Adverbialbestimmung", "Nur ein Subjekt"], "Ohne Prädikat kein Satz. Das Subjekt ist immer da – notfalls in der Personalendung versteckt (properaverunt = sie eilten)."], ["Satzglied-Strategie", "„Statim ad forum properaverunt.“ Wo ist das Subjekt?", ["Es steckt im Prädikat: „sie“", "statim", "ad forum", "Der Satz hat kein Subjekt"], "Kein Nominativ im Satz → das Subjekt steckt in der Endung -erunt (= sie)."], ["Satzglied-Strategie", "Das Prädikat endet auf -erunt. Was weißt du über das Subjekt?", ["Es steht im Plural (3. Person: sie)", "Es steht im Singular", "Es steht im Akkusativ", "Es ist ein Genitiv"], "Subjekt und Prädikat passen im Numerus zusammen: -nt/-erunt → Plural."], ["Satzglied-Strategie", "Welche Wörter sind KEINE Satzglieder?", ["et, quod, ubi (Bindewörter)", "statim, tandem", "Romani, Brutus", "petivit, occupavit"], "Bindewörter verbinden nur. Eure Lehrkraft kreist sie ein."], ["Satzglied-Strategie", "„cum multis viris“ – wie viele Satzglieder sind das?", ["Eins: zusammen eine AB", "Drei: AB, Attribut, Objekt", "Zwei: AB und Subjekt", "Gar keins"], "Präposition + Nomen (+ Adjektiv) gehören immer zusammen: Mit wem? – mit vielen Männern."], ["Satzglied-Strategie", "Ein Genitiv-Attribut …", ["hängt an einem Nomen und ist kein eigenes Satzglied", "ist immer das Subjekt", "ist immer eine AB", "steht immer am Satzanfang"], "Frage: Wessen? causam clamoris = der Grund des Geschreis. clamoris gehört zu causam."], ["Satzglied-Strategie", "Mit welchen Fragen findest du eine Adverbialbestimmung?", ["Wo? Wann? Wie? Womit? Warum?", "Wer oder was?", "Wen oder was?", "Wessen?"], "AB = Umstände. Typisch: Präposition + Nomen, Adverbien (statim) oder Ablative (gladiis)."], ["Satzglied-Strategie", "„Multitudo gladiis forum occupavit.“ Was ist gladiis?", ["AB (Womit? – mit Schwertern)", "Akkusativ-Objekt", "Subjekt", "Genitiv-Attribut"], "gladiis = Ablativ Plural. Ein Ablativ ohne Präposition ist meistens eine AB."], ["Satzglied-Strategie", "„forum“ kann Nominativ oder Akkusativ sein. Wie entscheidest du?", ["Am Satz: Gibt es schon ein Subjekt? Passt es zum Prädikat?", "Gar nicht – beides ist immer richtig", "forum ist immer Subjekt", "forum ist immer Genitiv"], "Bei Neutra ist Nom. = Akk. In „Brutus forum occupavit“ ist Brutus das Subjekt, also ist forum Akk.-Objekt."], ["Satzglied-Strategie", "Was gehört bei „rex superbus“ zusammen?", ["Beide Wörter: Adjektiv + Nomen = ein Satzglied", "Nur rex ist ein Satzglied, superbus ein eigenes", "superbus ist das Prädikat", "Gar nichts"], "Das Adjektiv richtet sich nach seinem Nomen (KNG) und gehört zum selben Satzglied."], ["Satzglied-Strategie", "Romani – Romanos – Romanorum: Was passt?", ["Subjekt – Akk.-Objekt – Gen.-Attribut", "Akk.-Objekt – Subjekt – AB", "Gen.-Attr. – Subjekt – Akk.-Objekt", "Alle drei sind Subjekte"], "-i = Nom. Pl., -os = Akk. Pl., -orum = Gen. Pl."], ["Deklination", "forum occupavit: Was ist „forum“?", ["Akk. Sg. N. (Akk.-Objekt)", "Nom. Sg. M. (Subjekt)", "Abl. Sg. N. (AB)", "Akk. Pl. N."], "forum, fori (o-Dekl.), Neutrum: Akk. Sg. = Nom. Sg. Hier Objekt von occupavit."], ["Deklination", "Romani (Z. 2): Kasus, Numerus, Genus?", ["Nom. Pl. M.", "Gen. Sg. M.", "Akk. Pl. M.", "Nom. Sg. F."], "Romanus (o-Dekl.). Nom. Pl. = Subjekt: „die Römer“."], ["Deklination", "scelere (Z. 5) heißt …", ["mit dem Verbrechen (Abl. Sg. N.)", "des Verbrechens (Gen. Sg.)", "die Verbrechen (Nom. Pl.)", "dem Verbrechen (Dat. Sg.)"], "scelus, sceleris (3. Dekl., N.). Abl. Sg. = -e, hier als AB (de scelere: „von dem Verbrechen“)."], ["Deklination", "post mortem: Nominativ und Deklination?", ["mors, mortis (3. Dekl.)", "mors, mortis (a-Dekl.)", "mortus, morti (o-Dekl.)", "morta, mortae (a-Dekl.)"], "mors ist Femininum der 3. Deklination. Hier Akk. Sg. nach der Präposition post."], ["Deklination", "clamoris (Z. 4) ist …", ["Gen. Sg. M. (Genitiv-Attribut)", "Nom. Pl. M. (Subjekt)", "Akk. Sg. M. (Objekt)", "Abl. Sg. M. (AB)"], "clamor, clamoris (3. Dekl.). causam clamoris = der Grund des Geschreis."], ["Deklination", "voces (Z. 3) ist …", ["Nom. Pl. F.", "Akk. Sg. F.", "Gen. Sg. F.", "Nom. Sg. F."], "vox, vocis (3. Dekl., F.). Subjekt zu terruerunt: die Stimmen."], ["Deklination", "arma (Z. 3) ist …", ["Nom. Pl. N. (Subjekt)", "Nom. Sg. F.", "Akk. Sg. M.", "Abl. Sg. F."], "arma, armorum (o-Dekl., N. Pl.): „die Waffen“. Neutra haben im Plural -a bei Nom. und Akk."], ["Deklination", "virorum (Z. 3) ist …", ["Gen. Pl. M.", "Gen. Sg. M.", "Akk. Pl. M.", "Nom. Pl. M."], "vir, viri (o-Dekl.): multitudo virorum = die Menge an Männern (Genitiv-Attribut)."], ["Deklination", "Romanos (Z. 3) ist …", ["Akk. Pl. M. (Akk.-Objekt)", "Nom. Pl. M. (Subjekt)", "Gen. Sg. M.", "Akk. Sg. M."], "Romanus (o-Dekl.). Endung -os = Akk. Pl. M.: „die Römer“ als Objekt von terruerunt."], ["Deklination", "homines (Z. 4): Nominativ und Deklination?", ["homo, hominis (3. Dekl.)", "homus, homi (o-Dekl.)", "homa, homae (a-Dekl.)", "homes, homitis (3. Dekl.)"], "homo, hominis: 3. Deklination. Nom. Pl. = homines (Subjekt)."], ["Deklination", "Welches Genus hat „multitudo“?", ["Femininum", "Maskulinum", "Neutrum", "Genus nicht bestimmbar"], "multitudo, multitudinis (3. Dekl.) ist Femininum: die Menge."], ["Deklination", "Nominativ Singular von „regis“ (Z. 5)?", ["rex", "regus", "regis", "regs"], "rex, regis (3. Dekl.). regis = Gen. Sg. (filii regis = des Königssohnes)."], ["Konjugation", "audiverunt heißt …", ["3. Pl. Ind. Perfekt", "3. Pl. Ind. Präsens", "3. Sg. Ind. Perfekt", "1. Pl. Ind. Perfekt"], "audire (i-Konj.): Perfektstamm audiv- + -erunt = sie haben gehört / sie hörten."], ["Konjugation", "Welche Endungen hat das Indikativ Perfekt Aktiv?", ["-i, -isti, -it, -imus, -istis, -erunt", "-o, -s, -t, -mus, -tis, -nt", "-, -te", "-or, -ris, -tur, -mur, -mini, -ntur"], "Die Perfektendungen sind in allen Konjugationen gleich."], ["Konjugation", "Präsens 3. Pl. von audire?", ["audiunt", "audient", "audiverunt", "audiant"], "Präsensendungen: -o, -s, -t, -mus, -tis, -nt. Bei der i-Konjugation: audio, audis, audit, audimus, auditis, audiunt."], ["Konjugation", "Imperativ Plural von tenere?", ["tenete", "tene", "tenent", "tenuerunt"], "Imperativ Sg. = Stamm (tene!), Pl. = Stamm + -te (tenete!)."], ["Konjugation", "Perfekt 1. Sg. von occupare?", ["occupavi", "occupo", "occupavit", "occupaverunt"], "occupa-v-i: Perfektstamm + -i = ich habe besetzt."], ["Konjugation", "terruerunt (Z. 3): Form und Infinitiv?", ["3. Pl. Perfekt von terrere", "3. Pl. Präsens von terrere", "3. Sg. Perfekt von terrere", "3. Pl. Perfekt von terrare"], "terrere (e-Konj.), Perfekt terru-: sie haben erschreckt."], ["Konjugation", "Imperativ Singular von properare?", ["propera!", "properate!", "properat", "properavi"], "a-Konjugation: propera! (Sg.), properate! (Pl.) = Eile! / Eilt!"], ["Konjugation", "petivit (Z. 1) heißt …", ["er suchte auf / hat aufgesucht", "sie suchten auf", "er sucht auf", "suche auf!"], "petere, Perfekt petiv-: petivit = 3. Sg. Perfekt."], ["Konjugation", "Präsens 2. Sg. von occupare?", ["occupas", "occupat", "occupo", "occupatis"], "occupo, occupas, occupat, occupamus, occupatis, occupant."], ["Vokabeln", "properare", ["eilen", "besetzen", "hören", "halten"], "properare, propero, properavi."], ["Vokabeln", "causa, causae f.", ["Grund, Ursache", "Zorn", "Stimme", "Schicksal"], "causam clamoris cognoscere = den Grund des Geschreis erfahren."], ["Vokabeln", "ira, irae f.", ["Zorn", "Eile", "Mord", "Ehre"], "iram non iam tenuerunt = sie hielten ihren    setStreak(ok);addXp(ok?10+(streak>=3?5:0):0);
   const c=it.t==="blitz"?"Satzglieder":cat;tally(c,ok?1:0,1);
   if(it.t==="blitz"){const bw=$("bw");bw.className="m-"+right;bw.style.cssText="--c:"+col(right)+";font-weight:700;padding:0 3px;"+(ok?"":"background:color-mix(in srgb,var(--ko) 14%,transparent);border-radius:6px");
    if(!ok&&!st.missS.includes(it.s.id))st.missS.push(it.s.id)}
   else{const k=it.q[1];if(ok)st.missQ=st.missQ.filter(z=>z!==k);else if(!st.missQ.includes(k))st.missQ.push(k)}
   save();
   const extra=it.t==="blitz"?(ok?"":"Du hast "+lt(v,1)+" gewählt → richtig ist "+lt(right)+"<br>")+"<b>"+LAB[right].q+"</b> "+esc(expl)+'<div class="de">'+esc(it.s.de)+"</div>":esc(expl);
   $("fbx").innerHTML='<div class="fb '+(ok?"good":"bad")+'"><b>'+(ok?["Richtig! 🎉","Optime! 💪","Bene! ⭐","Klasse! 🏛️"][Math.random()*4|0]:"Leider falsch.")+'</b><br>'+extra+'</div>'+nextBtn();
   $("nx").onclick=next;$("nx").scrollIntoView({behavior:"smooth",block:"nearest"})};
  $("opts").append(b)})}

/* ---------- Satzglied-Jagd ---------- */
let active=null,marks=[],words=[],hintUsed=false,checked=false;
function tokens(s){const out=[];s.parts.forEach((p,ci)=>{const ws=p[0].split(" ");ws.forEach((w,wi)=>{let punct="";if(w.endsWith(",")){punct=",";w=w.slice(0,-1)}
  const alt=[p[1]];
  if(w.toLowerCase()==="et"){if(p[1]!=="K")alt.push("K");else{const a=s.parts[ci-1],b=s.parts[ci+1];if(a&&b&&a[1]===b[1])alt.push(a[1])}}
  out.push({w,lab:p[1],alt,ci,punct})})});return out}
function hunt(s){active=null;hintUsed=false;checked=false;words=tokens(s);marks=words.map(()=>null);
 $("stage").innerHTML='<div class="cat">🎯 Satzglied-Jagd · '+esc(s.title)+'</div><div class="q" style="font-size:16px;font-weight:500">Wähle unten ein Satzglied und tippe dann alle Wörter an, die dazugehören.</div><div class="sent" id="sent"></div>'+
 '<div class="acts"><button class="big ghost" id="hintB">💡 Tipp: Gruppen zeigen</button><button class="big" id="chk" disabled></button></div><div id="hres"></div>';
 const sent=$("sent");let g=null,lastCi=-1;
 words.forEach((t,i)=>{if(t.ci!==lastCi){g=document.createElement("span");g.className="grp";sent.append(g);lastCi=t.ci}
  const d=document.createElement("span");d.className="wd";d.innerHTML='<span class="tp"></span><button class="w">'+esc(t.w)+'</button><span class="tg"></span>';
  d.querySelector(".w").onclick=()=>tap(i,d);g.append(d);
  if(t.punct){const p=document.createElement("span");p.className="punct";p.textContent=t.punct;g.append(p)}
  t.el=d});
 sent.lastChild.insertAdjacentHTML("beforeend",'<span class="punct">.</span>');
 $("hintB").onclick=()=>{if(checked)return;hintUsed=true;sent.classList.add("showgrp");$("hintB").disabled=true;$("hintB").textContent="💡 Gruppen sichtbar"};
 $("chk").onclick=check;palette();upd()}
function palette(){$("pal").classList.remove("hide");
 $("pbtns").innerHTML=ORDER.map(k=>'<button class="pb'+(active===k?" on":"")+'" data-k="'+k+'" style="--c:'+col(k)+'"><b>'+LAB[k].short+'</b>'+PQ[k]+'</button>').join("")+'<button class="pb era'+(active==="X"?" on":"")+'" data-k="X"><b>⌫</b>löschen</button>';
 [...$("pbtns").children].forEach(b=>b.onclick=()=>{if(checked)return;active=b.dataset.k;palette()});
 $("palHint").innerHTML=active?(active==="X"?"Tippe Wörter an, um die Markierung zu löschen":"Jetzt alle Wörter für <b style='color:"+col(active)+"'>"+LAB[active].name+"</b> antippen"):"🧭 Tipp: Kreise zuerst die Bindewörter ein, dann such das <b style='color:var(--L-P)'>Prädikat</b>!"}
function tap(i,d){if(checked)return;const b=d.querySelector(".w");
 if(!active){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);toast("Wähle zuerst unten ein Satzglied 👇");return}
 marks[i]=(active==="X"||marks[i]===active)?null:active;paint(i);b.classList.add("pop");setTimeout(()=>b.classList.remove("pop"),260);upd()}
function paint(i){const d=words[i].el,b=d.querySelector(".w"),k=marks[i];b.className="w"+(k?" sel m-"+k:"");b.style.cssText=k?"--c:"+col(k):"";
 const tg=d.querySelector(".tg");tg.style.cssText=k?"--c:"+col(k):"";tg.textContent=k?LAB[k].short:""}
function upd(){const left=marks.filter(m=>!m).length;$("chk").disabled=!!left;$("chk").textContent=left?"Noch "+left+" Wort"+(left>1?"e":"")+" offen":"✔ Prüfen"}
function check(){checked=true;$("pal").classList.add("hide");$("sent").classList.add("showgrp");$("hintB").classList.add("hide");$("chk").classList.add("hide");
 const s=deck[idx].s;let good=0;const wrongCi=new Map();
 words.forEach((t,i)=>{const ok=t.alt.includes(marks[i]);if(ok)good++;else if(!wrongCi.has(t.ci))wrongCi.set(t.ci,[]);if(!ok)wrongCi.get(t.ci).push([t.w,marks[i]]);
  const d=t.el,b=d.querySelector(".w"),k=ok?marks[i]:t.lab;d.classList.add(ok?"ok":"ko");
  b.className="w m-"+k;b.style.cssText="--c:"+col(k);
  d.querySelector(".tp").textContent=ok?"✓":LAB[marks[i]].short;
  const tg=d.querySelector(".tg");tg.style.cssText="--c:"+col(k);tg.textContent=LAB[k].short});
 const n=words.length,perfect=good===n;
 const stars=perfect?(hintUsed?2:3):good/n>=.7?2:good/n>=.4?1:0;
 addXp(good*2+(perfect&&!hintUsed?10:0));setStreak(perfect);tally("Satzglieder",good,n);
 if(perfect)st.missS=st.missS.filter(z=>z!==s.id);else if(!st.missS.includes(s.id))st.missS.push(s.id);save();
 if(stars===3)confetti();
 let h='<div class="stars">'+"⭐".repeat(stars)+"☆".repeat(3-stars)+'</div><div style="text-align:center;font-weight:700">'+good+" von "+n+" Wörtern richtig"+(perfect?" – perfekt! 🎉":"")+'</div>';
 if(wrongCi.size){h+='<div class="fb bad" style="margin-top:12px"><b>Das war noch falsch:</b>';
  wrongCi.forEach((ws,ci)=>{const p=s.parts[ci];h+='<div class="err"><div><i style="font-family:Georgia">'+esc(ws.map(x=>x[0]).join(" "))+'</i>: du hattest '+[...new Set(ws.map(x=>x[1]))].map(k=>lt(k,1)).join(" ")+' → richtig '+lt(p[1])+'<br><span class="sub" style="color:var(--tx)"><b>'+LAB[p[1]].q+'</b> '+esc(p[2])+'</span></div></div>'});h+='</div>'}
 h+='<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">📖 Alle Satzglieder erklärt</summary>'+s.parts.map(p=>'<div class="err"><div>'+lt(p[1])+' <i style="font-family:Georgia">'+esc(p[0].replace(/,$/,""))+'</i> – '+esc(p[2])+'</div></div>').join("")+'</details>';
 h+='<div class="de">🇩🇪 '+esc(s.de)+'</div>'+nextBtn();$("hres").innerHTML=h;$("nx").onclick=next}

/* ---------- Ende ---------- */
function fin(){$("play").classList.add("hide");$("pal").classList.add("hide");$("end").classList.remove("hide");
 const p=maxPts?Math.round(pts/maxPts*100):0;
 $("endIco").textContent=p>=90?"🏆":p>=70?"🥈":p>=50?"💪":"📚";
 $("res").textContent=p+" % richtig";
 $("resSub").innerHTML="+"+gained+" XP"+(bestStreak>=3?" · beste Serie: 🔥 "+bestStreak:"")+"<br>"+(p>=90?"Optime! Du bist bereit für die KA!":p>=70?"Bene! Noch ein bisschen üben, dann sitzt es.":"Nicht aufgeben – schau in die Fehler-Kiste und den Spickzettel!");
 $("bycat").innerHTML="<b>Nach Themen</b>"+Object.entries(stat).map(([c,[a,n]])=>'<div class="row"><span>'+c+'</span><span>'+a+" / "+n+'</span></div><div class="bar"><i style="width:'+(a/n*100)+'%"></i></div>').join("");
 if(p>=80)confetti();const before=rank();}
$("again").onclick=()=>startRound(lastMode);
$("toHome").onclick=$("quit").onclick=()=>{["play","end"].forEach(x=>$(x).classList.add("hide"));$("pal").classList.add("hide");$("home").classList.remove("hide");rank()};

/* ---------- Menü ---------- */
const cats=[...new Set(Q.map(x=>x[0]))];let sel=new Set(cats);
function chips(){$("chips").innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="chip"+(sel.has(c)?" on":"");b.textContent=c;b.onclick=()=>{sel.has(c)?sel.delete(c):sel.add(c);chips()};$("chips").append(b)});
 $("cnt").textContent=Q.filter(x=>sel.has(x[0])).length+" Fragen im Topf · 12 pro Runde";$("mixGo").disabled=!sel.size}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const m=b.dataset.go;if(m==="mix"){$("mixSel").classList.toggle("hide");chips();$("mixSel").scrollIntoView({behavior:"smooth"})}else startRound(m)});
$("mixGo").onclick=()=>startRound("mix");
rank();
</script></body></html>
