const $=id=>document.getElementById(id);

sh(x[2].map((t,k)=>[t,k===0])).forEach(([t,ok])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,ok,x);$("opts").append(b)})}
function pick(b,ok,x){[...$("opts").children].forEach(o=>{o.disabled=true;if(o.textContent===x[2][0])o.classList.add("ok")});
stat[x[0]]=stat[x[0]]||[0,0];stat[x[0]][1]++;
if(ok){score++;stat[x[0]][0]++}else{b.classList.add("ko");miss.push(x)}
$("fb").textContent=(ok?"Richtig! ":"Leider falsch. ")+x[3];$("sc").textContent=score+" Punkte";$("nx").textContent=i+1<deck.length?"Weiter":"Ergebnis";$("nx").classList.remove("hide")}
function fin(){$("play").classList.add("hide");$("end").classList.remove("hide");const p=Math.round(score/deck.length*100);
$("res").textContent=score+" von "+deck.length+" richtig ("+p+" %)";
$("bycat").innerHTML=Object.entries(stat).map(([c,[a,n]])=>'<div class="row"><span>'+c+'</span><span>'+a+'/'+n+'</span></div><div class="bar"><i style="width:'+(a/n*100)+'%"></i></div>').join("");
$("wrong").classList.toggle("hide",!miss.length);
try{const b=+localStorage.getItem("la_best")||0;if(p>b&&deck.length>=10)localStorage.setItem("la_best",p)}catch(e){}}
$("go").onclick=()=>start(Q.filter(x=>sel.has(x[0])));
$("nx").onclick=()=>{i++;i<deck.length?show():fin()};
$("again").onclick=()=>{$("end").classList.add("hide");$("start").classList.remove("hide");chips();best()};
$("wrong").onclick=()=>start(miss);
chips();best();
</script></body></html>
